# Die aktuelle Kampagne auf Deutsch (Beträge und Daten: content/campaign.yml).
title: Zehntausend Bäume für den Tanner Creek
text: >-
  Der Tanner Creek fließt warm und trüb, weil nichts ihn beschattet. Diesen
  Herbst und im kommenden Frühjahr wollen wir entlang seines letzten kahlen
  Abschnitts zehntausend heimische Bäume pflanzen. Mit 6 Dollar bezahlen wir
  einen Setzling, eine Hülle, die ihn vor Rehen schützt, und zwei Jahre
  Pflege.

# Eine kurze Beschreibung jedes Fotos in public/images/ für alle, die es
# nicht sehen können. Der Schlüssel ist der Dateiname ohne Endung.
alt:
  hero-river: Eine weite Biegung des Sallow River an einem nebligen Morgen, Platanen an den Ufern und in der Ferne ein Reiher auf einer Kiesbank
  planting-hands: Hände in Handschuhen setzen einen kleinen Baumsetzling neben seine Schutzhülle in ein schlammiges Ufer
  volunteers-bank: Freiwillige in Gummistiefeln, von hinten, tragen Setzlinge und Schaufeln am Fluss entlang
  dam-before: Das alte Betonwehr der Mühle bei Miller's Ford, dahinter stehendes, grünes Wasser
  dam-after: Miller's Ford nach dem Rückbau des Wehrs, der Bach fließt frei über Steine zwischen jungen Pflanzen
  water-testing: Jugendliche in Wathose am Fluss halten eine Probenflasche und eine weiße Schale mit kleinen Flussinsekten
  cleanup: Freiwillige in Gummistiefeln, von hinten, gehen mit Eimern, Schaufeln und Greifzangen am Flussufer entlang
  paddle: Zwei Kanus auf einem ruhigen Flussabschnitt zwischen herbstlichen Bäumen
  kingfisher: Ein Gürtelfischer, ein amerikanischer Eisvogel, sitzt auf einem Ast über dem Wasser
  creek-winter: Ein kleiner Bach im Winter, Schnee an den Ufern und eine Reihe junger Bäume in Schutzhüllen daneben

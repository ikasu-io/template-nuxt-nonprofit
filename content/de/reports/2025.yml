# Der Jahresbericht für ein Jahr, zu sehen unter /de/report/<Jahr>.
year: 2025
intro: >-
  2025 war das Jahr, in dem die Genehmigungen für Miller's Ford kamen, in
  dem wir die Marke von fünfzehntausend Bäumen überschritten haben und in
  dem drei weitere Schulen bei den Gewässeruntersuchungen eingestiegen sind.
  Hier steht, was wir mit Ihrem Geld gemacht haben – auf den Dollar genau.

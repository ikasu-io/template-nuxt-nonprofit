# Der Verein auf Deutsch: was er über sich sagt und welche Aufgabe jede
# Person aus content/org.yml hat (nach Namen).
tagline: Eine Nachbarschaft, die sich um ihren Fluss kümmert.
description: >-
  Ein gemeinnütziger Verein, getragen von seinen Mitgliedern: Wir pflanzen
  Wald an Bachufern, bauen alte Wehre zurück, untersuchen mit Schulen das
  Wasser und halten den Sallow River und seine Bäche rund um Wren Hollow,
  Ohio, sauber.
roles:
  Dolores Whitfield: Geschäftsführung
  Marcus Lee: Leitung Renaturierung
  Ana Ruiz: Umweltbildung und Freiwillige
  Gene Albright: Vorsitz, pensionierter Naturwissenschaftslehrer
  Priya Desai: Kasse, Buchhaltung
  Walt Henning: Anglerverein Sallow Valley
  Rosa Delgado: Grundschule Sallow Valley
  Tom Kessler: Landwirtschaft, Tanner Creek

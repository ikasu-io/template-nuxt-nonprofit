title: Ten thousand trees for Tanner Creek
text: >-
  Tanner Creek runs warm and muddy because nothing shades it. This fall
  and next spring we want to plant ten thousand native trees along its
  last bare mile. Every $6 buys a seedling, a tube to protect it from
  deer, and two years of weeding.

# The organization in English: what it says about itself, and what each
# person in content/org.yml does (by name).
tagline: Neighbors looking after a river.
description: >-
  A member-supported nonprofit that plants streamside forests, takes out
  old dams, tests the water with schools and cleans up the Sallow River
  and its creeks around Wren Hollow, Ohio.

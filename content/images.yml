# A short description of every photo in public/images/, for people who
# cannot see it. The key is the file name without its extension.
alt:
  hero-river: A wide bend of the Sallow River on a misty morning, with sycamores on the banks and a heron far off on a gravel bar
  planting-hands: Gloved hands planting a small tree seedling next to its tree tube on a muddy bank
  volunteers-bank: Volunteers in rain boots, seen from behind, carrying seedlings and shovels along the river
  dam-before: The old concrete mill dam at Miller's Ford, with still, green water behind it
  dam-after: Miller's Ford after the dam came out, the creek running freely over rocks between young plants
  water-testing: A student in waders holding up a sample bottle and a white tray of small river insects
  cleanup: Old tires and a rusty shopping cart pulled out of the river and piled on the bank
  paddle: Two canoes on a quiet stretch of river between autumn trees
  kingfisher: A belted kingfisher perched on a branch over the water
  creek-winter: A small creek in winter, snow on its banks and a row of young trees in tubes along it
